[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "it344-model-comparison"
version = "1.0.0"
description = "Snapshot-based model comparisons and a checked local LLM agent"
requires-python = ">=3.10"
dependencies = ["streamlit>=1.50,<2", "pandas>=2.2,<3", "plotly>=5.24,<7", "certifi>=2024.2.2"]

[project.optional-dependencies]
local = ["transformers==4.57.6", "torch>=2.6,<3", "safetensors>=0.4,<1"]
dev = ["pytest>=8,<10"]

[project.scripts]
model-lab = "model_compare.cli:main"

[tool.setuptools.packages.find]
include = ["model_compare*"]

[tool.setuptools.package-data]
model_compare = ["data/*.json", "data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
