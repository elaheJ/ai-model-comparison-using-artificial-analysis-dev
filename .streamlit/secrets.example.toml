# Copy these entries into the agent deployment's Advanced settings → Secrets.
# This example contains no credentials. Do not commit secrets.toml.
LLM_BASE_URL = "https://your-provider.example/v1"
LLM_MODEL = "your-provider-model-id"
# Set a server key so students do not need their own LLM accounts, or omit
# it to let each student enter a session key in Controller settings.
# LLM_API_KEY = "your-key-here"

# Add this instructor key to EACH deployment for automatic AA refresh.
# Students are never asked for an AA key. Without it, the saved snapshot works.
# AA_API_KEY = "your-aa-key-here"
